name: memory_mapped_list
description: >-
  A high-performance Dart package providing a List interface backed by
  memory-mapped files. Process datasets with billions of elements while
  maintaining a constant, minimal RAM footprint. Supports int32, int64,
  float32, float64, and any generic type via custom serializers.
  Cross-platform: Windows, Linux, macOS, iOS, Android.
version: 0.1.0
repository: https://github.com/yourname/memory_mapped_list
issue_tracker: https://github.com/yourname/memory_mapped_list/issues
documentation: https://yourname.github.io/memory_mapped_list

topics:
  - data-structures
  - performance
  - file-io
  - memory
  - list

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  ffi: ^2.1.0
  logging: ^1.2.0
  meta: ^1.11.0
  path: ^1.9.0

dev_dependencies:
  benchmark_harness: ^2.2.0
  build_runner: ^2.4.0
  lints: ^3.0.0
  mockito: ^5.4.4
  test: ^1.24.0
